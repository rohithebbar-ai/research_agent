[project]
name = "research-agent"
version = "0.1.0"
description = "Research & Career Agent Ecosystem — Phase 1 MVP (Scout + Summarizer)"
requires-python = ">=3.11"
dependencies = [
    "azure-functions>=1.20",
    "azure-cosmos>=4.7",
    "azure-storage-blob>=12.24",
    "openai>=1.50",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pymupdf>=1.24",
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
